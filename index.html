<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Penn State Research Partnerships — industry × faculty matchmaking with human review." />
    <meta name="theme-color" content="#001E44" />
    <title>Penn State Research Partnerships</title>
    <script>
      // Apply the saved theme before first paint (mirrors src/lib/theme.ts).
      try {
        var p = localStorage.getItem('psrp.theme') || 'light';
        var d = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
