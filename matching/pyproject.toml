[project]
name = "fime-matching"
version = "0.0.1"
description = "Faculty-Industry Matchmaking Engine: matching and algorithm workstream"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.14"]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.17", "jsonschema>=4.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
